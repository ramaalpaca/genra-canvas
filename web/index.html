<!doctype html>
<html lang="en-US" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Genra's infinite canvas for AI image, video and text creation" />
        <meta name="theme-color" content="#ED5B1D" />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Genra" />
        <meta property="og:title" content="Genra Canvas" />
        <meta property="og:description" content="Genra's infinite canvas for AI image, video and text creation" />
        <meta property="og:url" content="https://canvas.genra.ai/" />
        <meta property="og:image" content="https://canvas.genra.ai/og-image.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Genra Canvas" />
        <meta name="twitter:description" content="Genra's infinite canvas for AI image, video and text creation" />
        <meta name="twitter:image" content="https://canvas.genra.ai/og-image.png" />
        <link rel="icon" href="/favicon.ico" />
        <link rel="apple-touch-icon" href="/genra-logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
        <title>Genra Canvas</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
