name: Deploy Genra Canvas to Cloudflare Pages

# 照 video_mvp 的 deploy-frontend-editor.yml：production 分支推送即部署；main 只合并不部署。
on:
  push:
    branches:
      - production
    paths:
      - '.github/workflows/deploy.yml'
      - 'web/**'
      - 'VERSION'
      - 'CHANGELOG.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEPLOY_HOST
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          VITE_GENRA_API_URL: ${{ secrets.VITE_GENRA_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=genra-canvas --branch=production

      # 部署后：源站就绪验证 → prefix purge → 复验（同 editor 产线；背景见 video_mvp 的 deploy-frontend-editor.yml 注释）。
      # /assets/ 的 404 Function（web/functions/assets/[[path]].js）保证缺失 chunk 回 404 no-store，不会被边缘缓存成 HTML。
      - name: Verify origin, purge edge, verify again
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -e
          entry=$(grep -o '/assets/index-[^"]*\.js' web/dist/index.html | head -1)
          echo "entry chunk: ${entry:-<none>}"

          # 1) best-effort 等源站就绪，不 gate purge
          if [ -n "$entry" ]; then
            for i in $(seq 1 24); do
              ct=$(curl -s -o /dev/null -w "%{content_type}" -A "deploy-verify" \
                "https://canvas.genra.ai${entry}?v=$RANDOM$RANDOM")
              echo "origin probe $i: $ct"
              echo "$ct" | grep -q javascript && { echo "origin ready"; break; }
              sleep 5
            done
          fi

          # 2) prefix purge，无条件执行
          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["canvas.genra.ai/assets/"]}')
          echo "Cloudflare purge response: $resp"
          echo "$resp" | grep -q '"success":true' || { echo "::error::Cloudflare cache purge failed (见上面响应)"; exit 1; }

          # 3) 复验仅记录，不 fail
          ct=$(curl -s -o /dev/null -w "%{content_type}" -A "deploy-verify" "https://canvas.genra.ai${entry}")
          echo "post-purge edge probe: $ct（非门禁）"
